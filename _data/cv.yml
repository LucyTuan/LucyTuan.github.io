        highlights:
          - "Lead development of a test-time optimization pipeline for semantic 3D part decomposition, integrating physical reasoning to generate assembly-ready components."
          - "Designed a physics-based differentiable optimization framework that improves structural stability and reduces the sim-to-real gap for generated 3D assemblies."
          - "Achieved a 95% stable-assembly rate, outperforming state-of-the-art 3D part decomposition baselines by over 70 percentage points."

      - company: Natural Language Processing and Sentiment Analysis Lab, Academia Sinica
