        highlights:
          - "Pre-trained Taiwan VLM 70B, a large-scale vision-language model specialized for Traditional Chinese, outperforming LLaVA-1.5 by 9.1% on MMMU."
          - "Implemented tensor parallelism to scale ViT + LLaMA-3 training across 8 GPUs in a Linux HPC environment."
          - "Built a high-throughput preprocessing pipeline for 50M web documents and 3B+ tokens in a 3-person team."

